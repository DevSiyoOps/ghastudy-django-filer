name: Lint

on: [push]

jobs:
  ruff:
    timeout-minutes: 30
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install ruff
        # Keep the version in sync with the ruff-pre-commit rev in
        # .pre-commit-config.yaml so both report the same findings.
        run: pip install ruff==0.16.3
      - name: Run ruff
        # --output-format=github annotates the offending lines in the diff view
        run: ruff check --output-format=github
